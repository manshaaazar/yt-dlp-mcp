[project]
name = "ytdlp-mcp"
version = "0.2.0"
description = "YouTube MCP server built on yt-dlp: download video and audio, read transcripts, search YouTube, and sync playlists from Claude and any MCP client"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["mcp", "mcp-server", "model-context-protocol", "yt-dlp", "youtube", "youtube-downloader", "youtube-transcript", "claude", "claude-code", "claude-desktop", "cursor", "video", "audio", "playlist"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Video",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Internet :: WWW/HTTP",
]
authors = [
    { name = "manshaaazar" }
]
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.3.0",
    "yt-dlp[default]>=2026.10.26",
]

[project.urls]
Homepage = "https://github.com/manshaaazar/yt-dlp-mcp"
Repository = "https://github.com/manshaaazar/yt-dlp-mcp"
Issues = "https://github.com/manshaaazar/yt-dlp-mcp/issues"

[project.scripts]
ytdlp-mcp = "ytdlp_mcp:main"

[build-system]
requires = ["uv_build>=0.11.6,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: needs network access to YouTube and ffmpeg (deselect with -m \"not live\")"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
