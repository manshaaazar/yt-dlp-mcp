name: Container image

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md"]
  schedule:
    # Weekly: bump yt-dlp in the lockfile and rebuild, so the published image
    # keeps up with YouTube changes.
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      bump_ytdlp:
        description: "Upgrade yt-dlp in uv.lock before building"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'schedule' && 'main' || github.ref }}

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true

      - name: Upgrade yt-dlp in lockfile
        if: github.event_name == 'schedule' || inputs.bump_ytdlp
        id: bump
        run: |
          uv lock --upgrade-package yt-dlp
          if git diff --quiet uv.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Offline tests
        run: |
          uv sync --frozen
          uv run --frozen pytest -q -m "not live"

      - name: Commit updated lockfile
        if: steps.bump.outputs.changed == 'true'
        run: |
          VERSION=$(uv pip show yt-dlp | awk '/^Version:/ {print $2}')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: bump yt-dlp to $VERSION"
          git push origin HEAD:main

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha
          labels: |
            org.opencontainers.image.title=yt-dlp MCP server
            org.opencontainers.image.description=YouTube MCP server built on yt-dlp: download video and audio, read transcripts, search YouTube, and sync playlists from Claude and any MCP client

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
